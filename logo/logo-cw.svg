<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <!-- Dégradés premium simples et robustes -->
    <linearGradient id="blueGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E4FA6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0F3A7D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#051F49;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="blueShine" cx="30%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.35" />
      <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </radialGradient>

    <linearGradient id="orangeGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFAA33;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF9933;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E67E00;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="orangeShine" cx="30%" cy="30%" r="60%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.4" />
      <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Cercle de contour premium -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="#2B5CB8" stroke-width="1.2" opacity="0.3"/>
  <circle cx="100" cy="100" r="92" fill="none" stroke="#FF9933" stroke-width="0.8" opacity="0.2"/>

  <!-- W Orange - Couche principale -->
  <polyline points="65,48 85,155 110,78 135,155 155,48"
            fill="none" stroke="url(#orangeGradPrimary)" stroke-width="16"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- W Orange - Highlight -->
  <polyline points="65,48 85,155 110,78 135,155 155,48"
            fill="none" stroke="url(#orangeShine)" stroke-width="13"
            stroke-linecap="round" stroke-linejoin="round"
            opacity="0.65"/>

  <!-- C Bleu - Couche principale -->
  <path d="M 135,42 A 65,65 0 1,0 135,158" 
        fill="none" stroke="url(#blueGradPrimary)" stroke-width="18" 
        stroke-linecap="round"/>

  <!-- C Bleu - Highlight -->
  <path d="M 135,42 A 65,65 0 1,0 135,158" 
        fill="none" stroke="url(#blueShine)" stroke-width="15" 
        stroke-linecap="round"
        opacity="0.6"/>

  <!-- Accent intérieur bleu -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#2B5CB8" stroke-width="0.5" opacity="0.2"/>
  
  <!-- Accent intérieur orange -->
  <circle cx="100" cy="100" r="84" fill="none" stroke="#FF9933" stroke-width="0.4" opacity="0.15"/>

  <!-- Reflet central -->
  <ellipse cx="72" cy="72" rx="22" ry="22" fill="white" opacity="0.06"/>
</svg>
