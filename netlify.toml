[build]
  command = "echo 'Static site optimized - ready to deploy'"
  publish = "."
  ignore = "git diff --quiet $COMMIT_REF $COMMIT_REF~1 -- node_modules database SUPABASE_SETUP.md prompt-*.md"

# Traiter la redirection 404 pour les routes SPA
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
  force = false

# Headers de sécurité et cache pour tous les fichiers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cache-Control = "public, max-age=3600, must-revalidate"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' cdn.jsdelivr.net js.stripe.com; style-src 'self' 'unsafe-inline' fonts.googleapis.com cdn.jsdelivr.net; font-src 'self' fonts.gstatic.com cdn.jsdelivr.net; img-src 'self' data: https:; connect-src 'self' *.supabase.co api.stripe.com; frame-src js.stripe.com;"

# Cache plus court pour les composants HTML
[[headers]]
  for = "/components/*"
  [headers.values]
    Cache-Control = "public, max-age=1800, must-revalidate"
    Content-Type = "text/html; charset=utf-8"

[[headers]]
  for = "/header/*"
  [headers.values]
    Cache-Control = "public, max-age=1800, must-revalidate"
    Content-Type = "text/html; charset=utf-8"

[[headers]]
  for = "/footer/*"
  [headers.values]
    Cache-Control = "public, max-age=1800, must-revalidate"
    Content-Type = "text/html; charset=utf-8"

# Cache pour JavaScript
[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
    Content-Type = "application/javascript; charset=utf-8"

# Cache pour CSS
[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
    Content-Type = "text/css; charset=utf-8"

# Cache pour HTML
[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
    Content-Type = "text/html; charset=utf-8"
